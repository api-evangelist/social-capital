aid: social-capital
name: Social Capital
description: >-
  Social Capital is a technology investment firm founded in 2011 by Chamath Palihapitiya (a former
  Facebook executive) and headquartered in Palo Alto, California, with co-founders Mamoon Hamid and Ted
  Maidenberg. Originally a traditional venture fund that stood out by backing healthcare, financial
  services, education, and other hard, regulated sectors the VC community had neglected, the firm pivoted
  in 2018 into a technology holding company that stopped accepting outside capital and now invests from
  its own permanent balance sheet of roughly $2.1B, aiming to "earn like Berkshire Hathaway and invest
  like the Red Cross." Its thesis targets multiple emerging $10T markets across deep tech commercialization,
  life sciences and drug discovery, the global energy transition, and creator-economy media. Chamath became
  known as the "SPAC King" for taking companies public through the Social Capital Hedosophia (IPOA-IPOF)
  vehicles, including Virgin Galactic, Opendoor, Clover Health, and SoFi. Notable investments include
  Slack, Box, SurveyMonkey, Wealthfront, Netskope, Intercom, Groq, Palmetto, Saildrone, and Relativity Space.
